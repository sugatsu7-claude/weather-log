<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>槟城天气记录</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/tabler-icons/2.44.0/iconfont/tabler-icons.min.css">
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: #F4F1EA;
    color: #2C2C2A;
    padding: env(safe-area-inset-top) 16px env(safe-area-inset-bottom);
    min-height: 100vh;
  }
  .header {
    padding: 24px 0 16px;
  }
  .header h1 {
    font-size: 20px;
    font-weight: 500;
    margin: 0 0 2px;
  }
  .header p {
    font-size: 13px;
    color: #767570;
    margin: 0;
  }
  .card {
    background: #FFFFFF;
    border-radius: 16px;
    border: 0.5px solid #E1E0D9;
    padding: 16px;
    margin-bottom: 12px;
  }
  .period-label {
    font-size: 14px;
    font-weight: 500;
    color: #52514E;
    margin-bottom: 10px;
  }
  .icon-row {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
  }
  .icon-btn {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    padding: 12px 4px;
    border-radius: 12px;
    border: 0.5px solid #E1E0D9;
    background: #FCFCFB;
    font-size: 11px;
    color: #767570;
  }
  .icon-btn i {
    font-size: 22px;
  }
  .icon-btn.active {
    background: #E6F1FB;
    border-color: #85B7EB;
    color: #0C447C;
  }
  .icon-btn.active.storm { background: #EDE8F7; border-color: #9B7FD4; color: #3D2473; }
  .icon-btn.active.rain { background: #E6F1FB; border-color: #378ADD; color: #042C53; }
  .icon-btn.active.cloud { background: #F1EFE8; border-color: #B4B2A9; color: #444441; }
  .icon-btn.active.sun { background: #FAEEDA; border-color: #FAC775; color: #854F0B; }
  .status {
    text-align: center;
    font-size: 12px;
    color: #B4B2A9;
    height: 18px;
    margin: 4px 0 16px;
  }
  .stats {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-bottom: 12px;
  }
  .stat {
    background: #FFFFFF;
    border-radius: 12px;
    border: 0.5px solid #E1E0D9;
    padding: 14px;
  }
  .stat-label { font-size: 12px; color: #767570; margin: 0 0 4px; }
  .stat-value { font-size: 22px; font-weight: 500; margin: 0; }
  .trend-title {
    font-size: 13px;
    color: #767570;
    margin: 20px 0 10px;
  }
  .trend {
    display: flex;
    align-items: flex-end;
    gap: 4px;
    height: 90px;
    background: #FFFFFF;
    border-radius: 12px;
    border: 0.5px solid #E1E0D9;
    padding: 12px 8px 6px;
  }
  .bar-col {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-end;
    height: 100%;
  }
  .bar {
    width: 100%;
    max-width: 18px;
    border-radius: 3px 3px 0 0;
    background: #E1E0D9;
  }
  .bar-day {
    font-size: 9px;
    color: #B4B2A9;
    margin-top: 4px;
  }
  .month-title-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin: 20px 0 10px;
  }
  .month-title-row .month-title { margin: 0; }
  .month-picker {
    display: flex;
    gap: 6px;
  }
  .month-picker select {
    font-size: 12px;
    color: #52514E;
    background: #FFFFFF;
    border: 0.5px solid #E1E0D9;
    border-radius: 8px;
    padding: 4px 6px;
  }
  .year-chart {
    display: flex;
    align-items: flex-end;
    gap: 4px;
    height: 110px;
    background: #FFFFFF;
    border-radius: 12px;
    border: 0.5px solid #E1E0D9;
    padding: 14px 6px 6px;
  }
  .year-bar-col {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-end;
    height: 100%;
  }
  .year-bar-count {
    font-size: 9px;
    color: #767570;
    margin-bottom: 3px;
  }
  .year-bar {
    width: 100%;
    max-width: 20px;
    border-radius: 3px 3px 0 0;
    background: #378ADD;
  }
  .year-bar-label {
    font-size: 9px;
    color: #B4B2A9;
    margin-top: 4px;
  }
  .month-title {
    font-size: 13px;
    color: #767570;
    margin: 20px 0 10px;
  }
  .month-row {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 8px;
  }
  .month-row-label {
    font-size: 12px;
    color: #52514E;
    width: 32px;
    flex-shrink: 0;
  }
  .month-row-track {
    flex: 1;
    height: 10px;
    border-radius: 5px;
    background: #F1EFE8;
    overflow: hidden;
  }
  .month-row-fill {
    height: 100%;
    border-radius: 5px;
  }
  .month-row-pct {
    font-size: 12px;
    color: #767570;
    width: 32px;
    text-align: right;
    flex-shrink: 0;
  }
  .footer-hint {
    text-align: center;
    font-size: 11px;
    color: #B4B2A9;
    padding: 16px 0 4px;
  }
  .backup-row {
    display: flex;
    gap: 8px;
    margin-top: 16px;
  }
  .cloud-row {
    display: flex;
    gap: 8px;
    margin-top: 8px;
  }
  .settings-toggle {
    text-align: center;
    font-size: 12px;
    color: #B4B2A9;
    margin-top: 12px;
    padding: 6px;
  }
  .settings-panel {
    display: none;
    background: #FFFFFF;
    border-radius: 12px;
    border: 0.5px solid #E1E0D9;
    padding: 14px;
    margin-top: 8px;
  }
  .settings-panel.open { display: block; }
  .settings-panel label {
    display: block;
    font-size: 12px;
    color: #767570;
    margin: 10px 0 4px;
  }
  .settings-panel input {
    width: 100%;
    font-size: 13px;
    padding: 8px 10px;
    border-radius: 8px;
    border: 0.5px solid #E1E0D9;
    background: #FCFCFB;
  }
  .settings-save {
    margin-top: 12px;
    width: 100%;
    padding: 10px;
    border-radius: 10px;
    border: none;
    background: #1B3A6B;
    color: #FFFFFF;
    font-size: 13px;
  }
  .settings-hint {
    font-size: 11px;
    color: #B4B2A9;
    margin-top: 10px;
    line-height: 1.5;
  }
  .backup-btn {
    flex: 1;
    padding: 12px;
    border-radius: 12px;
    border: 0.5px solid #E1E0D9;
    background: #FFFFFF;
    font-size: 13px;
    color: #52514E;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
  }
  .backup-btn i { font-size: 16px; }
  #import-input { display: none; }
  .toast {
    position: fixed;
    left: 50%;
    bottom: 24px;
    transform: translateX(-50%) translateY(20px);
    background: #2C2C2A;
    color: #FFFFFF;
    font-size: 13px;
    padding: 10px 18px;
    border-radius: 20px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s, transform 0.2s;
    z-index: 999;
  }
  .toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }
</style>
</head>
<body>

<div class="header">
  <h1 id="today-title">今天</h1>
  <p>点选今天观察到的天气,可多选</p>
</div>

<div class="card">
  <div class="period-label">白天</div>
  <div class="icon-row" id="row-day"></div>
</div>

<div class="card">
  <div class="period-label">晚上</div>
  <div class="icon-row" id="row-night"></div>
</div>

<div class="status" id="status"></div>

<div class="stats">
  <div class="stat">
    <p class="stat-label">近14天下雨天数</p>
    <p class="stat-value" id="rain-days">–</p>
  </div>
</div>

<div class="trend-title">最近14天</div>
<div class="trend" id="trend"></div>

<div class="month-title-row">
  <span class="month-title" id="month-title">天气占比</span>
  <div class="month-picker">
    <select id="year-select"></select>
    <select id="month-select"></select>
  </div>
</div>
<div id="month-breakdown"></div>

<div class="month-title" id="year-title" style="margin-top:24px;">年度雷雨分布</div>
<div id="year-breakdown" class="year-chart"></div>

<div class="backup-row">
  <button class="backup-btn" id="export-btn"><i class="ti ti-download" aria-hidden="true"></i>导出备份</button>
  <button class="backup-btn" id="import-btn"><i class="ti ti-upload" aria-hidden="true"></i>导入备份</button>
</div>
<div class="cloud-row">
  <button class="backup-btn" id="cloud-backup-btn"><i class="ti ti-cloud-up" aria-hidden="true"></i>一键云备份</button>
  <button class="backup-btn" id="cloud-restore-btn"><i class="ti ti-cloud-down" aria-hidden="true"></i>从云端恢复</button>
</div>
<input type="file" id="import-input" accept="application/json">

<div class="settings-toggle" id="settings-toggle">云备份设置</div>
<div class="settings-panel" id="settings-panel">
  <label>GitHub 用户名</label>
  <input type="text" id="gh-owner" placeholder="sugatsu7-claude">
  <label>仓库名</label>
  <input type="text" id="gh-repo" placeholder="weather-log">
  <label>Personal Access Token</label>
  <input type="password" id="gh-token" placeholder="ghp_ 或 github_pat_ 开头">
  <button class="settings-save" id="settings-save-btn">保存设置</button>
  <p class="settings-hint">Token只存在这台设备本地,不会传给任何第三方。去 GitHub → Settings → Developer settings → Fine-grained tokens 新建一个,权限只勾选这个仓库的 Contents 读写即可。</p>
</div>

<div class="footer-hint">数据保存在本机,建议定期导出或云备份</div>

<div class="toast" id="toast"></div>

<script>
var PERIODS = [
  { key: 'day', label: '白天', containerId: 'row-day' },
  { key: 'night', label: '晚上', containerId: 'row-night' }
];
var OPTIONS = [
  { key: 'sun', label: '晴', icon: 'ti-sun', cls: 'sun' },
  { key: 'cloud', label: '多云', icon: 'ti-cloud', cls: 'cloud' },
  { key: 'rain', label: '雨', icon: 'ti-cloud-rain', cls: 'rain' },
  { key: 'storm', label: '雷雨', icon: 'ti-bolt', cls: 'storm' }
];

function todayKey() {
  var d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}

var today = new Date();
document.getElementById('today-title').textContent = '今天 ' + (today.getMonth() + 1) + '月' + today.getDate() + '日';

function showToast(msg) {
  var t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(showToast._timer);
  showToast._timer = setTimeout(function () { t.classList.remove('show'); }, 2000);
  var s = document.getElementById('status');
  if (s) s.textContent = msg;
}

var STORAGE_KEY = 'penang_weather_log';
var allData = {};
try {
  allData = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
} catch (e) {
  allData = {};
}

var tKey = todayKey();
if (!allData[tKey]) allData[tKey] = { day: null, night: null };
normalizeEntry(allData[tKey]);

function normalizeEntry(entry) {
  if (Array.isArray(entry.day)) entry.day = entry.day.length ? entry.day[entry.day.length - 1] : null;
  if (Array.isArray(entry.night)) entry.night = entry.night.length ? entry.night[entry.night.length - 1] : null;
  return entry;
}

function save() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(allData));
    var s = document.getElementById('status');
    showToast('已保存');
  } catch (e) {
    showToast('保存失败');
  }
  renderTrend();
}

function renderRows() {
  PERIODS.forEach(function (p) {
    var container = document.getElementById(p.containerId);
    container.innerHTML = '';
    OPTIONS.forEach(function (o) {
      var btn = document.createElement('button');
      btn.className = 'icon-btn' + (allData[tKey][p.key] === o.key ? ' active ' + o.cls : '');
      btn.innerHTML = '<i class="ti ' + o.icon + '" aria-hidden="true"></i><span>' + o.label + '</span>';
      btn.onclick = function () {
        allData[tKey][p.key] = (allData[tKey][p.key] === o.key) ? null : o.key;
        save();
        renderRows();
      };
      container.appendChild(btn);
    });
  });
}

function severity(entry, dateKey) {
  if (entry) normalizeEntry(entry);
  if (entry && (entry.day || entry.night)) {
    if (entry.day === 'storm' || entry.night === 'storm') return 'storm';
    if (entry.day === 'rain' || entry.night === 'rain') return 'rain';
    if (entry.day === 'cloud' || entry.night === 'cloud') return 'cloud';
    return 'sun';
  }
  if (dateKey && dateKey >= tKey) return 'sun';
  return null;
}

var SEV_COLOR = { storm: '#7C5CBF', rain: '#378ADD', cloud: '#B4B2A9', sun: '#FAC775' };
var SEV_HEIGHT = { storm: 100, rain: 78, cloud: 50, sun: 26 };
var SEV_LABEL = { storm: '雷雨', rain: '雨', cloud: '多云', sun: '晴' };

function hasRecord(entry) {
  return !!entry && (!!entry.day || !!entry.night);
}

function renderTrend() {
  var trend = document.getElementById('trend');
  trend.innerHTML = '';
  var rainDays = 0, recordedDays = 0;
  for (var i = 13; i >= 0; i--) {
    var d = new Date();
    d.setDate(d.getDate() - i);
    var key = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
    var entry = allData[key];
    var sev = severity(entry, key);
    if (hasRecord(entry)) recordedDays++;
    if (sev === 'rain' || sev === 'storm') rainDays++;
    var col = document.createElement('div');
    col.className = 'bar-col';
    var bar = document.createElement('div');
    bar.className = 'bar';
    if (sev) {
      bar.style.height = SEV_HEIGHT[sev] + '%';
      bar.style.background = SEV_COLOR[sev];
      bar.style.opacity = hasRecord(entry) ? '1' : '0.35';
    } else {
      bar.style.height = '4%';
      bar.style.background = '#E1E0D9';
    }
    var dayLabel = document.createElement('div');
    dayLabel.className = 'bar-day';
    dayLabel.textContent = d.getDate();
    col.appendChild(bar);
    col.appendChild(dayLabel);
    trend.appendChild(col);
  }
  document.getElementById('rain-days').textContent = rainDays + ' 天';
  renderMonthBreakdown();
  renderYearBreakdown();
}

function renderMonthBreakdown() {
  var y = parseInt(document.getElementById('year-select').value, 10);
  var m = parseInt(document.getElementById('month-select').value, 10);
  var counts = { sun: 0, cloud: 0, rain: 0, storm: 0 };
  var daysInMonth = new Date(y, m + 1, 0).getDate();
  var now = new Date();
  for (var i = 1; i <= daysInMonth; i++) {
    var d = new Date(y, m, i);
    if (d > now) break;
    var key = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
    var sev = severity(allData[key], key);
    if (sev) counts[sev]++;
  }
  var total = counts.sun + counts.cloud + counts.rain + counts.storm;
  var wrap = document.getElementById('month-breakdown');
  wrap.innerHTML = '';
  ['sun', 'cloud', 'rain', 'storm'].forEach(function (k) {
    var pct = total > 0 ? Math.round((counts[k] / total) * 100) : 0;
    var row = document.createElement('div');
    row.className = 'month-row';
    row.innerHTML =
      '<span class="month-row-label">' + SEV_LABEL[k] + '</span>' +
      '<div class="month-row-track"><div class="month-row-fill" style="width:' + pct + '%;background:' + SEV_COLOR[k] + ';"></div></div>' +
      '<span class="month-row-pct">' + pct + '%</span>';
    wrap.appendChild(row);
  });
  document.getElementById('month-title').textContent = y + '年' + (m + 1) + '月天气占比（已记录 ' + total + ' 天）';
}

function renderYearBreakdown() {
  var y = parseInt(document.getElementById('year-select').value, 10);
  var now = new Date();
  var monthCounts = [];
  var maxCount = 1;
  for (var mo = 0; mo < 12; mo++) {
    var daysInMonth = new Date(y, mo + 1, 0).getDate();
    var count = 0;
    for (var i = 1; i <= daysInMonth; i++) {
      var d = new Date(y, mo, i);
      if (d > now) break;
      var key = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
      var sev = severity(allData[key], key);
      if (sev === 'rain' || sev === 'storm') count++;
    }
    monthCounts.push(count);
    if (count > maxCount) maxCount = count;
  }
  var wrap = document.getElementById('year-breakdown');
  wrap.innerHTML = '';
  monthCounts.forEach(function (count, idx) {
    var pct = Math.max(Math.round((count / maxCount) * 100), count > 0 ? 8 : 3);
    var col = document.createElement('div');
    col.className = 'year-bar-col';
    col.innerHTML =
      '<span class="year-bar-count">' + (count > 0 ? count : '') + '</span>' +
      '<div class="year-bar" style="height:' + pct + '%;"></div>' +
      '<span class="year-bar-label">' + (idx + 1) + '月</span>';
    wrap.appendChild(col);
  });
  document.getElementById('year-title').textContent = y + '年各月雷雨天数分布';
}

function initPickers() {
  var now = new Date();
  var yearSelect = document.getElementById('year-select');
  var monthSelect = document.getElementById('month-select');
  var startYear = now.getFullYear() - 2;
  for (var y = now.getFullYear(); y >= startYear; y--) {
    var opt = document.createElement('option');
    opt.value = y;
    opt.textContent = y + '年';
    yearSelect.appendChild(opt);
  }
  for (var m = 0; m < 12; m++) {
    var opt2 = document.createElement('option');
    opt2.value = m;
    opt2.textContent = (m + 1) + '月';
    monthSelect.appendChild(opt2);
  }
  monthSelect.value = now.getMonth();
  yearSelect.onchange = function () { renderMonthBreakdown(); renderYearBreakdown(); };
  monthSelect.onchange = function () { renderMonthBreakdown(); };
}

initPickers();
renderRows();
renderTrend();

document.getElementById('export-btn').onclick = function () {
  var blob = new Blob([JSON.stringify(allData, null, 2)], { type: 'application/json' });
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  var d = new Date();
  var stamp = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  a.href = url;
  a.download = 'penang-weather-backup-' + stamp + '.json';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  var s = document.getElementById('status');
  showToast('备份已导出');
};

document.getElementById('import-btn').onclick = function () {
  document.getElementById('import-input').click();
};

document.getElementById('import-input').onchange = function (e) {
  var file = e.target.files[0];
  if (!file) return;
  var reader = new FileReader();
  reader.onload = function (evt) {
    try {
      var imported = JSON.parse(evt.target.result);
      Object.keys(imported).forEach(function (key) {
        allData[key] = imported[key];
      });
      localStorage.setItem(STORAGE_KEY, JSON.stringify(allData));
      if (!allData[tKey]) allData[tKey] = { day: null, night: null };
      normalizeEntry(allData[tKey]);
      renderRows();
      renderTrend();
      var s = document.getElementById('status');
      showToast('导入成功');
    } catch (err) {
      showToast('文件格式有误');
    }
  };
  reader.readAsText(file);
  e.target.value = '';
};

var GH_SETTINGS_KEY = 'penang_weather_gh_settings';
function loadGhSettings() {
  try { return JSON.parse(localStorage.getItem(GH_SETTINGS_KEY) || '{}'); }
  catch (e) { return {}; }
}
function saveGhSettings(s) {
  localStorage.setItem(GH_SETTINGS_KEY, JSON.stringify(s));
}

var ghSettings = loadGhSettings();
document.getElementById('gh-owner').value = ghSettings.owner || '';
document.getElementById('gh-repo').value = ghSettings.repo || '';
document.getElementById('gh-token').value = ghSettings.token || '';

document.getElementById('settings-toggle').onclick = function () {
  document.getElementById('settings-panel').classList.toggle('open');
};

document.getElementById('settings-save-btn').onclick = function () {
  ghSettings = {
    owner: document.getElementById('gh-owner').value.trim(),
    repo: document.getElementById('gh-repo').value.trim(),
    token: document.getElementById('gh-token').value.trim()
  };
  saveGhSettings(ghSettings);
  var s = document.getElementById('status');
  showToast('设置已保存');
};

function ghApiUrl() {
  return 'https://api.github.com/repos/' + ghSettings.owner + '/' + ghSettings.repo + '/contents/data.json';
}

function b64EncodeUnicode(str) {
  return btoa(unescape(encodeURIComponent(str)));
}
function b64DecodeUnicode(str) {
  return decodeURIComponent(escape(atob(str)));
}

document.getElementById('cloud-backup-btn').onclick = async function () {
  var s = document.getElementById('status');
  if (!ghSettings.owner || !ghSettings.repo || !ghSettings.token) {
    showToast('请先完成云备份设置');
    return;
  }
  showToast('备份中…');
  try {
    var sha = null;
    var getResp = await fetch(ghApiUrl(), {
      headers: { Authorization: 'Bearer ' + ghSettings.token, Accept: 'application/vnd.github+json' }
    });
    if (getResp.status === 200) {
      var getData = await getResp.json();
      sha = getData.sha;
    }
    var body = {
      message: '备份天气记录 ' + todayKey(),
      content: b64EncodeUnicode(JSON.stringify(allData, null, 2))
    };
    if (sha) body.sha = sha;
    var putResp = await fetch(ghApiUrl(), {
      method: 'PUT',
      headers: { Authorization: 'Bearer ' + ghSettings.token, Accept: 'application/vnd.github+json' },
      body: JSON.stringify(body)
    });
    if (putResp.status === 200 || putResp.status === 201) {
      showToast('云备份成功');
    } else {
      showToast('备份失败,检查Token权限');
    }
  } catch (e) {
    showToast('备份失败,网络或设置有误');
  }
};

document.getElementById('cloud-restore-btn').onclick = async function () {
  var s = document.getElementById('status');
  if (!ghSettings.owner || !ghSettings.repo || !ghSettings.token) {
    showToast('请先完成云备份设置');
    return;
  }
  showToast('恢复中…');
  try {
    var getResp = await fetch(ghApiUrl(), {
      headers: { Authorization: 'Bearer ' + ghSettings.token, Accept: 'application/vnd.github+json' }
    });
    if (getResp.status !== 200) {
      showToast('云端还没有备份记录');
      return;
    }
    var getData = await getResp.json();
    var imported = JSON.parse(b64DecodeUnicode(getData.content));
    Object.keys(imported).forEach(function (key) {
      allData[key] = imported[key];
    });
    localStorage.setItem(STORAGE_KEY, JSON.stringify(allData));
    if (!allData[tKey]) allData[tKey] = { day: null, night: null };
    normalizeEntry(allData[tKey]);
    renderRows();
    renderTrend();
    showToast('云端数据已恢复');
  } catch (e) {
    showToast('恢复失败');
  }
};
</script>
